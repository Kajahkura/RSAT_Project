[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rsat-audit"
version = "2.0.0"
description = "Portable, evidence-based endpoint security auditing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "OFINFIX"}]
dependencies = []

[project.optional-dependencies]
crypto = ["pycryptodomex==3.23.0"]

[project.scripts]
rsat = "rsat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rsat = ["policies/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
