name: Test and build RSAT

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: python -m ruff check src tests scripts
      - run: python -m pytest --cov=rsat --cov-report=term-missing --cov-fail-under=80
      - run: python scripts/native_smoke.py
      - run: python -m rsat audit --deadline 45 --command-timeout 5 --output smoke-output

  browser:
    name: Browser report validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-visual.txt -e .
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py

  build:
    name: Build ${{ matrix.os }}
    needs: [test, browser]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: python scripts/build.py
      - name: Smoke-test standalone audit and cryptography
        run: python scripts/binary_smoke.py
      - run: python scripts/release_manifest.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RSAT-${{ matrix.os }}
          path: dist/*

  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --repo ${{ github.repository }} --dir release-assets
      - name: Give metadata unique platform names
        run: |
          python - <<'PY'
          from pathlib import Path
          for folder in Path('release-assets').iterdir():
              for file in folder.iterdir():
                  if file.name in {'SHA256SUMS.txt', 'build-environment.cdx.json', 'LICENSE', 'pycryptodomex.txt'}:
                      file.rename(file.with_name(folder.name + '-' + file.name))
          PY
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-assets/**/RSAT_*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
