name: Hosted workspace security validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hosted-web.yml
      - scripts/web_smoke.py
      - scripts/verify_hosted_web.py
      - docs/deployment.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsat-hosted-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted:
    name: Live HTTPS artifact and browser security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RSAT_WEB_BASE_URL: https://rsat-workspace.blinkhost.website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify public files against the pinned release archive
        run: python scripts/verify_hosted_web.py
      - run: python -m pip install -r requirements-visual.txt -e ".[crypto]"
      - run: python -m playwright install --with-deps chromium
      - name: Exercise onboarding and local evidence security on the live site
        run: python scripts/ci_browser.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: RSAT-hosted-web-validation
          path: |
            hosted-web-verification.json
            docs/assets/workspace-*.png
